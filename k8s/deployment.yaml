apiVersion: apps/v1
kind: Deployment

metadata:
name: petitpanier
labels:
app: petitpanier
environment: production
version: v1

spec:
replicas: 4

revisionHistoryLimit: 5

strategy:
type: RollingUpdate
rollingUpdate:
maxSurge: 1
maxUnavailable: 0

selector:
matchLabels:
app: petitpanier

template:
metadata:
labels:
app: petitpanier
version: v1

spec:
  terminationGracePeriodSeconds: 30

  containers:
    - name: web
      image: petitpanier:1.0
      imagePullPolicy: IfNotPresent

      ports:
        - name: http
          containerPort: 8080
          protocol: TCP

      startupProbe:
        httpGet:
          path: /
          port: http
        failureThreshold: 30
        periodSeconds: 5

      livenessProbe:
        httpGet:
          path: /
          port: http
        initialDelaySeconds: 10
        periodSeconds: 10

      readinessProbe:
        httpGet:
          path: /
          port: http
        periodSeconds: 5

      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 128Mi